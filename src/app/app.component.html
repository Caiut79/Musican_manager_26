<!-- Sidebar -->
<app-sidebar
  [collapsed]="sidebarCollapsed"
  [mobileOpen]="mobileMenuOpen"
  (sidebarToggle)="toggleSidebar()"
  (sidebarClose)="closeMobileMenu()">
</app-sidebar>

<!-- Main layout wrapper (shifts right to make room for sidebar) -->
<div class="app-layout" [class.sidebar-collapsed]="sidebarCollapsed">

  <!-- Mobile top bar (hamburger + brand) -->
  <header class="mobile-header">
    <button type="button" class="hamburger" (click)="toggleSidebar()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-brand">♪ Musicista</span>
  </header>

  <!-- Routed content -->
  <main class="app-content">
    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
