<ng-container *ngIf="!isPublicRoute(); else registerLayout">
  <div class="app-shell-backdrop" aria-hidden="true">
    <span class="app-shell-orb orb-a"></span>
    <span class="app-shell-orb orb-b"></span>
    <span class="app-shell-grid"></span>
  </div>

  <app-sidebar
    [collapsed]="sidebarCollapsed"
    [mobileOpen]="mobileMenuOpen"
    [badgeCounts]="sidebarBadges"
    (sidebarToggle)="toggleSidebar()"
    (sidebarClose)="closeMobileMenu()"
    (logoutClick)="logout()">
  </app-sidebar>

  <div class="app-layout" [class.sidebar-collapsed]="sidebarCollapsed">
    <header class="mobile-header">
      <button *ngIf="!mobileMenuOpen" type="button" class="hamburger" (click)="toggleSidebar()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <span class="mobile-brand">
        <img class="mobile-brand-logo" src="assets/mm-logo.svg" alt="">
        <span class="mobile-brand-text">
          <strong>Musican Manager</strong>
          <small>Agenda live</small>
        </span>
      </span>
      <button type="button" class="mobile-notifications" (click)="openNotifications()" aria-label="Notifiche">
        <span class="mobile-notifications-icon">🔔</span>
        <span class="mobile-notifications-badge" *ngIf="unreadNotifications > 0">{{ unreadNotifications }}</span>
      </button>
    </header>
    <main class="app-content" aria-label="Contenuto principale">
      <div class="container">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <!-- Toast notifications -->
  <div class="toast-container">
    <div class="toast" *ngFor="let t of toasts" (click)="onToastClick(t)">
      <div class="toast-icon">🔔</div>
      <div class="toast-body">
        <div class="toast-title">{{ t.title }}</div>
        <div class="toast-msg">{{ t.message }}</div>
      </div>
      <button type="button" class="toast-close" (click)="dismissToast(t.id); $event.stopPropagation()">✕</button>
    </div>
  </div>
</ng-container>

<ng-template #registerLayout>
  <section class="register-shell" aria-label="Registrazione musicista">
    <div class="register-shell-backdrop" aria-hidden="true">
      <span class="register-orb register-orb-a"></span>
      <span class="register-orb register-orb-b"></span>
    </div>
    <router-outlet></router-outlet>
  </section>
</ng-template>
