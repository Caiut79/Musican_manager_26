<!-- Mobile overlay backdrop -->
<div class="sidebar-backdrop" *ngIf="mobileOpen" (click)="sidebarClose.emit()"></div>

<!-- Sidebar panel -->
<aside class="sidebar" [class.collapsed]="collapsed" [class.mobile-open]="mobileOpen">

  <!-- Header -->
  <div class="sidebar-header">
    <i class="brand-icon ti ti-music"></i>
    <span class="brand-name">
      <strong>Musicista</strong>
      <small>By Band Manager</small>
    </span>
    <button type="button" class="toggle-btn" (click)="sidebarToggle.emit()"
            [title]="collapsed ? 'Fissa aperto' : 'Modalità hover'">
      <i class="ti" [ngClass]="collapsed ? 'ti-layout-sidebar-left-expand' : 'ti-layout-sidebar-left-collapse'"></i>
    </button>
  </div>

  <!-- Nav -->
  <nav class="sidebar-nav">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
      [title]="item.label"
      (click)="sidebarClose.emit()">
      <i class="nav-icon ti {{ item.icon }}"></i>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </nav>

  <!-- Theme switcher -->
  <div class="theme-row">
    <button class="theme-btn" [class.active]="currentTheme === 'light'"
            (click)="setTheme('light')" title="Chiara">
      <i class="ti ti-sun"></i>
      <span class="theme-lbl">Chiara</span>
    </button>
    <button class="theme-btn" [class.active]="currentTheme === 'dark'"
            (click)="setTheme('dark')" title="Scura">
      <i class="ti ti-moon"></i>
      <span class="theme-lbl">Scura</span>
    </button>
    <button class="theme-btn" [class.active]="currentTheme === 'amoled'"
            (click)="setTheme('amoled')" title="AMOLED">
      <i class="ti ti-circle-filled"></i>
      <span class="theme-lbl">AMOLED</span>
    </button>
  </div>

</aside>
