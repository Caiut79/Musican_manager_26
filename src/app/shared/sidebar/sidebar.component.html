<!-- Mobile overlay backdrop -->
<div class="sidebar-backdrop" [class.open]="mobileOpen" (click)="sidebarClose.emit()" aria-hidden="true"></div>

<!-- Sidebar panel -->
<aside class="sidebar" [class.collapsed]="collapsed" [class.mobile-open]="mobileOpen">

  <!-- Header -->
  <div class="sidebar-header">
    <div class="brand-stack">
      <img class="brand-logo" src="assets/mm-logo.svg" alt="Musican Manager">
      <div class="brand-mm">MM</div>
    </div>
    <span class="brand-name">
      <strong>Musican Manager</strong>
      <small>Gestione professionale</small>
    </span>
    <button *ngIf="!mobileOpen" type="button" class="sidebar-toggle" (click)="sidebarToggle.emit()" aria-label="Apri/chiudi menu">
      <i class="ti ti-menu-2"></i>
    </button>
  </div>

  <!-- Nav -->
  <nav class="sidebar-nav" aria-label="Navigazione">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
      [title]="item.label"
      (click)="sidebarClose.emit()">
      <i class="nav-icon ti {{ item.icon }}"></i>
      <span class="nav-label">{{ item.label }}</span>
      <span class="nav-badge" *ngIf="badgeCounts[item.route] > 0">{{ badgeCounts[item.route] }}</span>
    </a>
  </nav>

  <!-- Theme switcher -->
  <div class="theme-row">
    <button type="button" class="theme-btn" [class.active]="currentTheme === 'light'"
            (click)="setTheme('light')" title="Chiara">
      <i class="ti ti-sun"></i>
      <span class="theme-lbl">Chiara</span>
    </button>
    <button type="button" class="theme-btn" [class.active]="currentTheme === 'dark'"
            (click)="setTheme('dark')" title="Scura">
      <i class="ti ti-moon"></i>
      <span class="theme-lbl">Scura</span>
    </button>
    <button type="button" class="theme-btn" [class.active]="currentTheme === 'amoled'"
            (click)="setTheme('amoled')" title="AMOLED">
      <i class="ti ti-circle-filled"></i>
      <span class="theme-lbl">AMOLED</span>
    </button>
  </div>

  <div class="sidebar-footer">
    <button type="button" class="logout-btn" (click)="logoutClick.emit(); sidebarClose.emit()">
      <i class="ti ti-logout"></i>
      <span class="theme-lbl">Logout</span>
    </button>
  </div>

</aside>
